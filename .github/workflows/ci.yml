name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_NAME: Comunicacao Interna
      APP_DB_SCHEMA: comunicacao
      DATABASE_URL: sqlserver://localhost:1433;database=ci;user=sa;password=LocalDev_Password1;encrypt=true;trustServerCertificate=true
      AUTH_SECRET: ci-secret-must-be-at-least-16
      AUTH_URL: http://localhost:3000
      AUTH_MICROSOFT_ENTRA_ID_ID: ci
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ci
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/ci/v2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
